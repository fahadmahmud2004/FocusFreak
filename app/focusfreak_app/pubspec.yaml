name: focusfreak_app
description: "FocusFreak — offline-first focus & time management, and the companion app for the FocusFreak desk bot."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.6.1

  # data
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  path: ^1.9.1

  # navigation
  go_router: ^17.2.3

  # ui
  fl_chart: ^1.2.0

  # reports & export
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  file_picker: ^11.0.3

  # platform
  #
  # permission_handler was removed on 3 August 2026. Nothing imported it — the
  # app asks for its own permissions from BtClassicPlugin.kt, which is the same
  # decision as writing the Bluetooth transport by hand. Its Android module also
  # broke the build outright: permission_handler_android 14 declares AGP 9.0.1
  # and Kotlin 2.3.20, and its build script fails to compile against this
  # project's AGP 8.9.1 / Kotlin 2.1.0.
  sensors_plus: ^7.1.0
  flutter_local_notifications: ^20.1.0

  # sound
  #
  # The cue tones are generated into assets/sounds/ by tools/make_sounds.py and
  # played from there, so sound works with no network. audioplayers sits behind
  # SoundOutput in lib/platform/sound_player.dart — nothing else imports it.
  audioplayers: ^6.7.1

  # The one link the app has: the footer credit in More.
  url_launcher: ^6.3.2

  # utils
  intl: ^0.20.3
  collection: ^1.19.1
  uuid: ^4.6.0
  characters: ^1.4.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/rules/
    # Generated by tools/make_sounds.py — see that file before re-tuning one.
    - assets/sounds/
