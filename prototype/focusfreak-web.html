<title>FocusFreak Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@300;500&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width app column (max 440px), centered; tab bar pinned to the bottom;
   session, done, break and review are full-screen layers above it. Gold on ink, from the app's logo. */
:root{
  --bg:#0B0B0D; --surface:#141417; --raised:#1C1C21; --line:#2A2A31;
  --fg:#F3EFE4; --muted:#A09B90; --accent:#F0C44A; --accent-fill:#F0C44A; --accent-soft:rgba(240,196,74,.14);
  --on-accent:#1A1405; --ok:#21CE73; --warn:#F5A623; --bad:#E5484D; --claimed:#4A4A55; --scrim:rgba(0,0,0,.62);
  --c0:#3E6BFF; --c1:#00CA8C; --c2:#FF8A1F; --c3:#4FCB4F;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-bn:'Hind Siliguri','Noto Sans Bengali',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#FAF8F4; --surface:#FFFFFF; --raised:#F1EEE7; --line:#E0DCD2;
    --fg:#17150F; --muted:#69655B; --accent:#8F6410; --accent-fill:#F0C44A; --accent-soft:rgba(184,134,42,.14);
    --on-accent:#1A1405; --ok:#12884A; --warn:#B26E08; --bad:#C2363B; --claimed:#CFCAC0; --scrim:rgba(20,18,12,.45);
    --c0:#2F56E0; --c1:#00A574; --c2:#D96A00; --c3:#2E9E33; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#FAF8F4; --surface:#FFFFFF; --raised:#F1EEE7; --line:#E0DCD2;
  --fg:#17150F; --muted:#69655B; --accent:#8F6410; --accent-fill:#F0C44A; --accent-soft:rgba(184,134,42,.14);
  --on-accent:#1A1405; --ok:#12884A; --warn:#B26E08; --bad:#C2363B; --claimed:#CFCAC0; --scrim:rgba(20,18,12,.45);
  --c0:#2F56E0; --c1:#00A574; --c2:#D96A00; --c3:#2E9E33; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#141417; --raised:#1C1C21; --line:#2A2A31;
  --fg:#F3EFE4; --muted:#A09B90; --accent:#F0C44A; --accent-fill:#F0C44A; --accent-soft:rgba(240,196,74,.14);
  --on-accent:#1A1405; --ok:#21CE73; --warn:#F5A623; --bad:#E5484D; --claimed:#4A4A55; --scrim:rgba(0,0,0,.62);
  --c0:#3E6BFF; --c1:#00CA8C; --c2:#FF8A1F; --c3:#4FCB4F; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang="bn"] body{font-family:var(--f-bn),var(--f-body)}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
html[lang="bn"] h1,html[lang="bn"] h2,html[lang="bn"] h3{font-family:var(--f-bn)}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums slashed-zero}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
html[lang="bn"] .eyebrow{letter-spacing:0;font-size:12px}

#app{max-width:440px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){#app{border-inline:1px solid var(--line)}}
.view{display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--raised);border:1px solid var(--line);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{min-height:56px;font-size:17px;border-radius:18px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn svg{width:20px;height:20px;flex:none}
.btn.sm svg{width:16px;height:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--raised);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.gold{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill .blip{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok .blip{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.sample-flag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 5px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* today */
.goal{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-family:var(--f-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.status{font-size:15px;line-height:1.4;color:var(--fg)}
.intent{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:8px 0;font-size:17px;font-family:var(--f-display);font-weight:500}
html[lang="bn"] .intent{font-family:var(--f-bn)}
.intent:focus{outline:none;border-bottom-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.quick button:hover{border-color:var(--accent)}
.quick b{font-family:var(--f-mono);font-size:24px;font-weight:500}
.quick span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line)}
.thumb canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.promo{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.promo .thumb{width:56px;height:56px}

/* focus setup */
.dial{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.dial .mins{font-family:var(--f-mono);font-size:64px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.dial .unit{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent-fill);height:28px}
.field{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--raised);padding:0 14px;font-size:15px}
.field:focus{outline:none;border-color:var(--accent)}
.grows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grows button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;font-weight:600}
.grows button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.grows canvas{width:100%;aspect-ratio:1;border-radius:10px;image-rendering:pixelated;display:block;max-width:100%}
.routine{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.routine:first-of-type{border-top:0}
.blocks{display:flex;gap:3px;height:10px}
.blocks i{display:block;border-radius:3px;height:100%}
.mixsum{display:flex;flex-wrap:wrap;gap:6px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:14px 24px}
.stage{width:min(78vw,300px);max-width:100%;aspect-ratio:1;border-radius:26px;overflow:hidden;border:1px solid var(--line);margin:0 auto;background:#0d1210;position:relative}
.stage canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.countdown{font-family:var(--f-mono);font-size:72px;font-weight:300;line-height:1;text-align:center;letter-spacing:-2px;font-variant-numeric:tabular-nums slashed-zero}
.sess-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.vbar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;display:flex}
.vbar i{display:block;height:100%}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.ctl .disc{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.ctl.main .disc{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}
.ctl.arm .disc{border-color:var(--bad);color:var(--bad)}
.ctl.arm{color:var(--bad)}
.ctl svg{width:22px;height:22px}
#session.deep .hide-deep{display:none}
#session.deep{background:#000}
#session.deep .countdown{font-size:min(26vw,140px);color:#E8E2CF;margin-top:auto}
#session.deep .stage{opacity:.55;width:min(40vw,160px);border-color:#1a1a1a}
#session.deep .deep-exit{display:block}
.deep-exit{display:none;text-align:center;color:#6d695f;font-size:13px;margin-bottom:auto;padding:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.share{display:flex;justify-content:center}
.share canvas{width:180px;height:320px;border-radius:14px;border:1px solid var(--line);max-width:100%}

/* break */
.breath{width:220px;height:220px;max-width:100%;margin:12px auto;position:relative;display:flex;align-items:center;justify-content:center}
.breath .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c1) 55%,transparent),color-mix(in srgb,var(--c1) 12%,transparent) 70%);animation:box 16s linear infinite;transform:scale(.55)}
.breath .ring2{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--line)}
.breath b{position:relative;font-family:var(--f-display);font-size:22px}
@keyframes box{0%{transform:scale(.55)}25%{transform:scale(1)}50%{transform:scale(1)}75%{transform:scale(.55)}100%{transform:scale(.55)}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.snd{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.snd .ico{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.snd .ico[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.snd .ico svg{width:22px;height:22px}
.snd .nm{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.snd .nm small{font-weight:400;color:var(--muted);font-size:12px}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.presets .chip{flex:none}

/* world */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--raised);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pano{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.pano canvas{width:100%;aspect-ratio:2/1;image-rendering:pixelated;display:block;max-width:100%}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coll figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.coll canvas{width:100%;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);image-rendering:pixelated;display:block;max-width:100%}
.coll figcaption{font-size:12px;line-height:1.3}
.coll figcaption span{display:block;color:var(--muted);font-size:11px}

/* stats */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bv{fill:var(--accent-fill)}
.chart .bc{fill:var(--claimed)}
.chart .now{fill:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hm rect{rx:3}
.hm .h0{fill:var(--raised)}
.hm .h1{fill:var(--accent-fill);fill-opacity:.25}
.hm .h2{fill:var(--accent-fill);fill-opacity:.5}
.hm .h3{fill:var(--accent-fill);fill-opacity:.75}
.hm .h4{fill:var(--accent-fill)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--raised)}
.stack i{display:block;height:100%}
.insight{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.insight:first-child{border-top:0}
.insight .n{font-family:var(--f-mono);color:var(--accent);font-size:13px;padding-top:1px}

/* me */
.level{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.emblem{width:72px;height:72px;border-radius:20px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.emblem canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.xp{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.xp i{display:block;height:100%;background:var(--accent-fill);border-radius:4px}
.unlocks{display:flex;flex-direction:column;gap:8px}
.unlock{display:flex;gap:12px;align-items:center;font-size:14px}
.unlock .thumb{width:40px;height:40px}
.unlock.locked{opacity:.5}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:0}
.badge .b{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:500;border:2px solid var(--accent);color:var(--accent)}
.badge.locked .b{border-color:var(--line);color:var(--muted);border-style:dashed}
.badge.locked{opacity:.6}
.badge small{font-size:11px;color:var(--muted);line-height:1.25}
.badge strong{font-size:12px;line-height:1.2}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .grow small{display:block;color:var(--muted);font-size:12px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--raised);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent-fill);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--on-accent)}

/* review */
#review{background:#0E0D0A;color:#F3EFE4}
.rv-bars{display:flex;gap:4px;padding-top:6px}
.rv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;display:block}
.rv-bars i b{display:block;height:100%;width:0;background:#F0C44A}
.rv-slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:12px 4px;cursor:pointer}
.rv-slide .k{font-family:var(--f-display);font-size:56px;line-height:1;color:#F0C44A}
html[lang="bn"] .rv-slide .k{font-family:var(--f-bn)}
.rv-slide h2{font-size:26px;color:#F3EFE4}
.rv-slide p{color:#B9B3A5;font-size:16px;max-width:34ch}
.rv-slide canvas{width:100%;max-width:360px;aspect-ratio:2/1;image-rendering:pixelated;border-radius:14px;display:block}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:min(400px,calc(100vw - 32px));box-shadow:0 8px 30px rgba(0,0,0,.3);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

const BN_DIG='০১২৩৪৫৬৭৮৯';

const t=s=>L()==='bn'&&BN[s]?BN[s]:s;
const nn=x=>L()==='bn'?String(x).replace(/[0-9]/g,d=>BN_DIG[d]):String(x);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDur(sec){const m=Math.round(sec/60),h=Math.floor(m/60),r=m%60;if(L()==='bn')return nn(h?`${h}ঘ ${r}মি`:`${r}মি`);return h?`${h}h ${String(r).padStart(2,'0')}m`:`${r}m`}
function fmtClock(sec){sec=Math.max(0,Math.ceil(sec));const m=Math.floor(sec/60),s=sec%60;return nn(String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'))}
function fmtHour(h){if(L()==='bn')return nn((h%12||12)+'টা');return (h%12||12)+(h<12?' AM':' PM')}
const DAYS_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DAYS_BN=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
const DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DAYS_FULL_BN=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];

const dfull=i=>L()==='bn'?DAYS_FULL_BN[i]:DAYS_FULL[i];

/* ================= time helpers ================= */
function dayStart(ts){const x=new Date(ts);x.setHours(0,0,0,0);return x.getTime()}
function addDays(ts,k){const x=new Date(ts);x.setDate(x.getDate()+k);x.setHours(0,0,0,0);return x.getTime()}
const sessOn=day=>S.sessions.filter(s=>dayStart(s.start)===day);
const sumV=list=>list.reduce((a,s)=>a+s.verified,0);
const sumC=list=>list.reduce((a,s)=>a+s.claimed,0);
const real=()=>S.sessions.filter(s=>!s.sample);
function streak(){let d=dayStart(Date.now());if(sumV(sessOn(d))<600)d=addDays(d,-1);let n=0;while(sumV(sessOn(d))>=600){n++;d=addDays(d,-1)}return n}

/* ================= rng / colour ================= */
function mkRng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function hx(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,k){const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=p=>1-(1-p)*(1-p);

/* ================= catalogue ================= */
const CATS=[{n:'Deep work',v:'--c0'},{n:'Active work',v:'--c1'},{n:'Practice',v:'--c2'},{n:'Routine',v:'--c3'}];
function species(min){return min<20?'Tulsi':min<35?'Fern':min<60?'Sunflower':'TREE'}
const TREES={banyan:{n:'Banyan',bn:'বটগাছ',lv:1},krishnachura:{n:'Krishnachura',bn:'কৃষ্ণচূড়া',lv:2},sonalu:{n:'Sonalu',bn:'সোনালু',lv:3}};
const SPN={Tulsi:'তুলসী',Fern:'ফার্ন',Sunflower:'সূর্যমুখী'};
function itemName(s){
  if(s.theme==='garden'){const sp=species(s.planned);if(sp==='TREE'){const tr=TREES[s.tree||'banyan'];return L()==='bn'?tr.bn:tr.n}return L()==='bn'?SPN[sp]:sp}
  if(s.theme==='city'){const f=floors(s.planned);return L()==='bn'?nn(f)+' তলা দালান':f+'-floor tower'}
  return constName(s.seed);
}
const floors=min=>clamp(Math.round(min/5),3,18);
function constName(seed){const r=mkRng(seed^0x51);const a=['Quiet','Patient','Long','Steady','Bright','Slow','Brave'],b=['Owl','Kite','Boat','Lantern','Heron','River','Tiger','Lotus'];
  const ab=['শান্ত','ধৈর্যশীল','দীর্ঘ','স্থির','উজ্জ্বল','ধীর','সাহসী'],bb=['পেঁচা','ঘুড়ি','নৌকা','লণ্ঠন','বক','নদী','বাঘ','পদ্ম'];
  const i=Math.floor(r()*a.length),j=Math.floor(r()*b.length);return L()==='bn'?ab[i]+' '+bb[j]:'The '+a[i]+' '+b[j]}

/* ================= sample history ================= */
function makeSample(){
  const r=mkRng(20261117),out=[],today=dayStart(Date.now());
  const durs=[25,25,50,45,60,90,15,25,50],hours=[9,10,10,11,15,16,20,21,22,8];
  for(let d=27;d>=1;d--){
    if(r()<.18)continue;
    const day=addDays(today,-d),n=1+Math.floor(r()*3);
    let hour=hours[Math.floor(r()*hours.length)];
    for(let k=0;k<n;k++){
      const planned=durs[Math.floor(r()*durs.length)],done=r()<.86;
      const claimed=done?planned*60:Math.round(planned*60*(.3+r()*.5));
      const ratio=planned>=90?.72+r()*.2:.82+r()*.17;
      const theme=['garden','garden','city','sky'][Math.floor(r()*4)];
      out.push({id:'s'+day+k,start:day+hour*3600000+Math.floor(r()*40)*60000,planned,claimed,verified:Math.round(claimed*ratio),
        cat:Math.floor(r()*4),theme,done,dist:Math.floor(r()*(planned>45?4:2)),label:'',seed:Math.floor(r()*1e9),tree:'banyan',sample:true});
      hour=Math.min(23,hour+1+Math.floor(planned/60));
    }
  }
  return out;
}
if(!Array.isArray(S.sessions)){S.sessions=makeSample();save()}

/* ================= pixel scenes (96x96) ================= */
function P(ctx){return{
  r(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))},
  disc(cx,cy,r,c){ctx.fillStyle=c;r=Math.round(r);for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));ctx.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}},
  line(x0,y0,x1,y1,c){ctx.fillStyle=c;x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let i=0;i<300;i++){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
}}
function drawBg(ctx,g,s){
  const gr=ctx.createLinearGradient(0,0,0,96);
  if(s.theme==='garden'){
    gr.addColorStop(0,'#17221d');gr.addColorStop(1,'#26372c');ctx.fillStyle=gr;ctx.fillRect(0,0,96,96);
    g.r(8,10,30,28,'#2b4655');g.r(8,10,30,1,'#3b5d6e');g.r(22,10,2,28,'#17221d');g.r(8,23,30,2,'#17221d');
    g.r(9,11,6,4,'#3f6577');
    g.r(0,93,96,3,'#4a3424');g.r(0,92,96,1,'#6a4c34');
  }else if(s.theme==='city'){
    gr.addColorStop(0,'#0a0f21');gr.addColorStop(1,'#1f2a4e');ctx.fillStyle=gr;ctx.fillRect(0,0,96,96);
    g.disc(78,16,5,'#efe8cf');g.disc(80,14,5,'#0d1328');
    const r=mkRng(s.seed^77);let x=0;while(x<96){const w=5+Math.floor(r()*8),h=8+Math.floor(r()*22);g.r(x,88-h,w,h,'#18213f');x+=w+1}
    g.r(0,88,96,8,'#111626');for(let i=0;i<96;i+=8)g.r(i+2,92,4,1,'#2d3555');
  }else{
    gr.addColorStop(0,'#03050c');gr.addColorStop(1,'#0e1636');ctx.fillStyle=gr;ctx.fillRect(0,0,96,96);
    if(s.aurora){for(let x=0;x<96;x++){const y=22+Math.sin(x/11+s.seed%7)*6;for(let k=0;k<14;k++){ctx.fillStyle='rgba(80,230,160,'+(0.16*(1-k/14))+')';ctx.fillRect(x,y+k,1,1)}}}
    const r=mkRng(s.seed^99);for(let i=0;i<45;i++){ctx.fillStyle='rgba(255,255,255,'+(.15+r()*.3)+')';ctx.fillRect(Math.floor(r()*96),Math.floor(r()*80),1,1)}
    for(let x=0;x<96;x++){const y=Math.round(86+Math.sin(x/9+s.seed%5)*3);g.r(x,y,1,96-y,'#060912')}
  }
}
function drawPlant(g,s,p){
  const v=s.vigor==null?1:s.vigor;
  const leaf=mix('#8a8a52','#4cc85a',v),leafD=mix('#62623c','#2f9a44',v),stem=mix('#6c7040','#3a9a46',v);
  for(let y=83;y<=93;y++){const ins=Math.floor((y-83)/4);g.r(38+ins,y,20-2*ins,1,'#b5562f');g.r(39+ins,y,1,1,'#d27a4a')}
  g.r(36,80,24,3,'#c9733f');g.r(36,80,24,1,'#e08a55');g.r(38,79,20,1,'#3b2a1f');
  if(p<.04){g.r(47,77,2,2,'#8a5a2b');return}
  const e=ease(p),sp=species(s.planned),r=mkRng(s.seed);
  if(sp==='Tulsi'){
    const h=Math.round(4+22*e);g.r(48,79-h,1,h,stem);
    for(let k=1;k*4<h;k++){const y=79-k*4,sz=k*4>h-6?2:3;g.r(48-sz,y,sz,2,leaf);g.r(49,y,sz,2,leafD)}
    if(p>.8){const top=79-h;for(let i=0;i<5;i++){g.r(48,top-1-i,1,1,i%2?'#a77ad8':'#7d58b0')}g.r(46,top+1,1,2,'#9b6bd0');g.r(50,top+1,1,2,'#9b6bd0')}
  }else if(sp==='Fern'){
    const angs=[-62,-34,-8,18,44,68],lens=angs.map(()=>16+r()*14);
    angs.forEach((a,i)=>{const L=lens[i]*e,rad=a*Math.PI/180;for(let st=0;st<L;st++){
      const x=48+Math.sin(rad)*st,y=79-Math.cos(rad)*st+st*st*.014*Math.abs(Math.sin(rad)+.3);g.r(x,y,1,1,stem);
      if(st%2===0&&st>2){const lf=Math.max(1,Math.round((L-st)/5));const px=Math.cos(rad),py=Math.sin(rad);
        for(let q=1;q<=lf;q++){g.r(x+px*q,y+py*q,1,1,leaf);g.r(x-px*q,y-py*q,1,1,leafD)}}}});
  }else if(sp==='Sunflower'){
    const h=Math.round(6+42*e),top=79-h;g.r(47,top,2,h,stem);
    [[.3,-1],[.5,1],[.7,-1]].forEach(([f,d])=>{if(h*f>6){const y=79-h*f;g.disc(48+d*5,y,Math.min(3,1+h/16),leaf);g.r(48+d*2,y,d>0?3:-3,1,leafD)}});
    if(p>.62){const rr=Math.round(2+6*clamp((p-.62)/.38,0,1));g.disc(48,top,rr+2,mix('#a8922a','#f5c518',v));g.disc(48,top,Math.max(1,Math.round(rr*.6)),'#5b3a1a')}
    else{g.disc(48,top,2,leafD)}
  }else{
    const tr=s.tree||'banyan',w=2+Math.round(4*e),h=Math.round(10+34*e),top=79-h;
    const blobs=[];for(let i=0;i<18;i++)blobs.push([48+(r()-.5)*44,(r()-.65)*16,4+r()*5,r()]);
    const roots=[];for(let i=0;i<6;i++)roots.push([30+r()*36,r()]);
    g.r(48-w/2,top,w,h,'#6b4a2b');g.r(48-w/2,top,1,h,'#87603a');
    if(e>.3){g.line(48,top+8,40,top+2,'#6b4a2b');g.line(48,top+6,57,top,'#6b4a2b')}
    const n=Math.round(3+15*e);
    const base=tr==='krishnachura'?['#2f7a3a','#3f9a46']:tr==='sonalu'?['#5c8a35','#7aa844']:[mix('#5f6a3a','#2c7a3a',v),mix('#7a8448','#3e9a48',v)];
    for(let i=0;i<n;i++){const b=blobs[i];const rr=b[2]*(.5+.5*e);g.disc(b[0],top+b[1],rr,base[0]);g.disc(b[0]-1,top+b[1]-1,Math.max(1,rr-1.5),base[1])}
    if(tr==='krishnachura'&&p>.55){const k=mkRng(s.seed^5);for(let i=0;i<Math.round(60*(p-.55)/.45);i++){const b=blobs[Math.floor(k()*n)];g.r(b[0]+(k()-.5)*b[2]*1.8,top+b[1]+(k()-.5)*b[2]*1.6,1+(k()<.3),1,k()<.5?'#e8452c':'#ff7a3a')}}

  const bh=bestHour(l),tot=sumV(l)||1,win=[bh.h-1,bh.h,bh.h+1].reduce((a,h)=>a+(bh.hrs[(h+24)%24]||0),0);
  out.push(bn?`তোমার যাচাইকৃত সময়ের ${nn(Math.round(win/tot*100))}% আসে ${fmtHour((bh.h+23)%24)} থেকে ${fmtHour((bh.h+2)%24)} এর মধ্যে। কঠিন কাজ এই সময়ে রাখো।`
    :`${Math.round(win/tot*100)}% of your verified time lands between ${fmtHour((bh.h+23)%24)} and ${fmtHour((bh.h+2)%24)}. Put the hard work there.`);
  const b=[[0,30],[31,60],[61,999]].map(([a,z])=>{const x=l.filter(s=>s.planned>=a&&s.planned<=z);return x.length?sumV(x)/Math.max(1,sumC(x)):null});
  if(b[1]!=null&&b[2]!=null){out.push(bn?`৩১ থেকে ৬০ মিনিটের ব্লকে তুমি ${nn(Math.round(b[1]*100))}% যাচাইকৃত থাকো, ৬০ মিনিটের বেশিতে ${nn(Math.round(b[2]*100))}%।`
    :`Blocks of 31 to 60 minutes stay ${Math.round(b[1]*100)}% verified. Longer ones stay ${Math.round(b[2]*100)}%.`)}
  const clean=l.filter(s=>s.dist===0&&s.done).length;
  out.push(bn?`গত চার সপ্তাহে ${nn(clean)}টা ব্লক একবারও বাইরে না গিয়ে শেষ করেছ।`:`${clean} blocks in the last four weeks finished without stepping away once.`);
  return out;
}

let RUN=null,TICK=null,WAKE=null;
function startSession(min,opts){
  opts=opts||{};AU.init();AU.resume();

  RUN={id:'u'+Date.now(),planned:min,cat:opts.cat!=null?opts.cat:su.cat,theme:su.theme,label:opts.label!=null?opts.label:su.label.trim(),seed:Math.floor(Math.random()*1e9),
    tree:S.settings.tree,aurora:S.settings.sky==='aurora',start:Date.now(),elapsed:0,verified:0,dist:0,state:'running',last:performance.now(),visible:!document.hidden,awayAt:0,routine:opts.routine||null,armStop:0};

  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>WAKE=w).catch(()=>{})}catch(e){}
  showSession();clearInterval(TICK);TICK=setInterval(tick,250);
}
function accumulate(){if(!RUN)return;const now=performance.now(),dt=now-RUN.last;RUN.last=now;if(RUN.state==='running'){RUN.elapsed+=dt;if(RUN.visible)RUN.verified+=dt}}
function tick(){if(!RUN)return;accumulate();if(RUN.elapsed>=RUN.planned*60000){finish(true);return}paintSession()}
document.addEventListener('visibilitychange',()=>{
  if(!RUN)return;accumulate();const now=performance.now();
  if(document.hidden){RUN.visible=false;RUN.awayAt=now;RUN.dist++;if(S.settings.strict&&RUN.state==='running'){RUN.state='paused';RUN.autoPaused=true}}
  else{RUN.visible=true;const away=(now-RUN.awayAt)/1000;
    if(RUN.autoPaused){RUN.state='running';RUN.autoPaused=false;toast(L()==='bn'?`ফিরে এসেছ। ${fmtClock(away)} টাইমার থেমে ছিল।`:`Welcome back. The clock was paused for ${fmtClock(away)}.`)}
    else if(away>2)toast(`${t('Welcome back')}. ${fmtClock(away)} ${t('not counted as verified')}.`);
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>WAKE=w).catch(()=>{})}catch(e){}
    paintSession()}
});

function finish(completed){
  if(!RUN)return;accumulate();clearInterval(TICK);TICK=null;
  const R=RUN;RUN=null;try{WAKE&&WAKE.release()}catch(e){}WAKE=null;
  const claimed=Math.round(Math.min(R.elapsed,R.planned*60000)/1000),verified=Math.round(Math.min(R.verified,R.planned*60000)/1000);
  const rec={id:R.id,start:R.start,planned:R.planned,claimed,verified,cat:R.cat,theme:R.theme,done:completed,dist:R.dist,label:R.label,seed:R.seed,tree:R.tree,aurora:R.aurora,sample:false};
  if(R.routine&&completed&&R.routine.idx>=R.routine.blocks.length-1)rec.routineDone=true;
  if(claimed>=30){S.sessions.push(rec);save()}
  AU.fade(0,4);setTimeout(()=>{if(!RUN)AU.stopAll()},4200);
  if(completed)AU.chime('end');
  document.getElementById('session').hidden=true;
  showDone(rec,R.routine,claimed>=30);

}
function drawShare(cv,s){
  const ctx=cv.getContext('2d'),bn=L()==='bn',ff=bn?'"Hind Siliguri", sans-serif':'"Bricolage Grotesque", system-ui, sans-serif',mono='"JetBrains Mono", monospace';
  const gr=ctx.createLinearGradient(0,0,0,640);gr.addColorStop(0,'#0B0B0D');gr.addColorStop(1,'#1d1a10');ctx.fillStyle=gr;ctx.fillRect(0,0,360,640);
  ctx.fillStyle='#F0C44A';ctx.font='700 22px '+ff;ctx.fillText('FocusFreak',28,52);
  ctx.fillStyle='#9a958a';ctx.font='500 14px '+ff;ctx.fillText(fmtDate(s.start)+' · '+t(CATS[s.cat].n),28,76);
  const off=mkCanvas();drawScene(off,sceneFor(s),progressOf(s),{now:0});ctx.imageSmoothingEnabled=false;
  ctx.save();ctx.beginPath();ctx.roundRect?ctx.roundRect(36,100,288,288,24):ctx.rect(36,100,288,288);ctx.clip();ctx.drawImage(off,0,0,96,96,36,100,288,288);ctx.restore();
  ctx.fillStyle='#F3EFE4';ctx.font='700 26px '+ff;ctx.fillText(itemName(s).slice(0,22),28,430);
  ctx.fillStyle='#F0C44A';ctx.font='300 56px '+mono;ctx.fillText(fmtDur(s.verified),28,500);
  ctx.fillStyle='#9a958a';ctx.font='500 15px '+ff;ctx.fillText(bn?'যাচাইকৃত ফোকাস':'verified focus',28,526);
  ctx.fillText((bn?'দাবিকৃত ':'claimed ')+fmtDur(s.claimed)+'  ·  '+nn(Math.round(s.verified/Math.max(1,s.claimed)*100))+'%',28,556);
  ctx.fillStyle='#5f5b52';ctx.font='500 12px '+ff;ctx.fillText(bn?'প্রতিটা মিনিট যাচাই করা।':'Every minute checked, none guessed.',28,606);
}

/* ================= break ================= */
let BRK=null;
const TIPS=[['Roll your shoulders back five times.','কাঁধ পাঁচবার পেছনে ঘোরাও।'],['Look at something 6 metres away for 20 seconds.','২০ সেকেন্ড ৬ মিটার দূরের কিছুর দিকে তাকাও।'],['Drink a glass of water.','এক গ্লাস পানি খাও।'],['Stand up and stretch your arms over your head.','উঠে দাঁড়াও, হাত মাথার ওপরে টানো।'],['Close your eyes and listen to the room.','চোখ বন্ধ করে ঘরের শব্দ শোনো।']];
function startBreak(min,routine){
  const el=document.getElementById('brk');document.getElementById('done').hidden=true;el.hidden=false;
  BRK={end:Date.now()+min*60000,min,routine,t0:Date.now()};
  const tip=TIPS[Math.floor(Math.random()*TIPS.length)];
  el.innerHTML=`<div class="ov" style="text-align:center">
   <p class="eyebrow">${t('Break')}${routine?' · '+esc(routine.name):''}</p>
   <h1 class="mono" id="bcd" style="font-family:var(--f-mono);font-weight:300;font-size:56px">${fmtClock(min*60)}</h1>
   <div class="breath"><div class="ring2"></div><div class="orb"></div><b id="bph">${t('Inhale')}</b></div>
   <p class="muted">${L()==='bn'?'বক্স ব্রিদিং: ৪ সেকেন্ড করে।':'Box breathing, four seconds each.'}</p>
   <p style="font-size:16px">${esc(L()==='bn'?tip[1]:tip[0])}</p>
   <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    ${routine?`<button class="btn primary big" data-act="breakEnd">${t('Next block')}</button>`:''}
    <button class="btn big" data-act="${routine?'breakEnd':'breakQuit'}">${t('Skip break')}</button>
    ${routine?`<button class="btn ghost" data-act="breakQuit">${L()==='bn'?'রুটিন শেষ করো':'End routine'}</button>`:''}</div></div>`;
  clearInterval(BRK.iv);BRK.iv=setInterval(()=>{if(!BRK)return;const left=(BRK.end-Date.now())/1000;
    document.getElementById('bcd').textContent=fmtClock(left);
    const ph=Math.floor(((Date.now()-BRK.t0)/1000%16)/4);document.getElementById('bph').textContent=t(['Inhale','Hold','Exhale','Hold'][ph]);
    if(left<=0){AU.chime('start');if(BRK.routine)breakEnd();else breakQuit()}},250);
}
function breakEnd(){const r=BRK&&BRK.routine;clearInterval(BRK&&BRK.iv);BRK=null;document.getElementById('brk').hidden=true;
  if(r){const idx=r.idx+2;if(idx<r.blocks.length){const b=r.blocks[idx];startSession(b[0],{cat:b[1],label:'',routine:Object.assign({},r,{idx,focusIdx:r.focusIdx+1})})}else{go('today')}}}
function breakQuit(){if(BRK)clearInterval(BRK.iv);BRK=null;document.getElementById('brk').hidden=true;go('today')}

/* ================= review ================= */
let RV=null;
function openReview(){
  const bn=L()==='bn',today=dayStart(Date.now()),wk=S.sessions.filter(s=>s.start>=addDays(today,-6));
  const days=[];for(let i=6;i>=0;i--){const d=addDays(today,-i);days.push({d,v:sumV(sessOn(d))})}
  const best=days.reduce((a,b)=>b.v>a.v?b:a,days[0]),bh=bestHour(wk),wv=sumV(wk),wc=sumC(wk);
  const g=wk.filter(s=>s.theme==='garden').length,c=wk.filter(s=>s.theme==='city').length,k=wk.filter(s=>s.theme==='sky').length;
  const slides=[
    `<p class="eyebrow" style="color:#9a958a">${bn?'এই সপ্তাহে':'This week'}</p><span class="k">${fmtDur(wv)}</span><h2>${bn?'যাচাইকৃত ফোকাস':'of verified focus'}</h2><p>${bn?`${nn(wk.length)}টা ব্লক, ${fmtDur(wc)} দাবিকৃত। যাচাই হয়েছে ${nn(Math.round(wv/Math.max(1,wc)*100))}%।`:`${wk.length} blocks and ${fmtDur(wc)} claimed. ${Math.round(wv/Math.max(1,wc)*100)}% of it checked out.`}</p>`,
    `<p class="eyebrow" style="color:#9a958a">${bn?'সেরা দিন':'Best day'}</p><span class="k">${dfull(new Date(best.d).getDay())}</span><p>${bn?`${fmtDur(best.v)} যাচাইকৃত। ওই দিন কী আলাদা ছিল, মনে করে দেখো।`:`${fmtDur(best.v)} verified. Worth remembering what was different that day.`}</p>`,
    `<p class="eyebrow" style="color:#9a958a">${bn?'সেরা সময়':'Peak hour'}</p><span class="k">${fmtHour(bh.h)}</span><p>${bn?'এই সময়টা পাহারা দাও। মিটিং বা ফোন এখানে না রাখাই ভালো।':'Guard this hour. Keep calls and errands out of it.'}</p>`,
    `<p class="eyebrow" style="color:#9a958a">${bn?'যা বেড়েছে':'What grew'}</p><h2>${bn?`${nn(g)}টা গাছ, ${nn(c)}টা দালান, ${nn(k)}টা নক্ষত্রমণ্ডল`:`${g} plants, ${c} towers, ${k} constellations`}</h2><canvas id="rvCv" width="192" height="96"></canvas>`,
    `<p class="eyebrow" style="color:#9a958a">${bn?'পরের সপ্তাহের জন্য':'For next week'}</p><h2>${bn?`${fmtHour(bh.h)} এর দিকে তিনটা গভীর ব্লক রাখো।`:`Book three deep blocks near ${fmtHour(bh.h)}.`}</h2><p>${bn?'ছোট লক্ষ্য, প্রতিদিন। স্ট্রিক নিজে থেকেই আসবে।':'Small, every day. The streak takes care of itself.'}</p><button class="btn primary" data-act="rvClose" style="align-self:flex-start">${t('Done')}</button>`
  ];
  const el=document.getElementById('review');el.hidden=false;
  el.innerHTML=`<div class="ov"><div class="rv-bars">${slides.map(()=>'<i><b></b></i>').join('')}</div>
   <div class="row between"><span class="eyebrow" style="color:#9a958a">FocusFreak</span><button class="btn sm ghost" data-act="rvClose" style="color:#F3EFE4;border-color:#333">${L()==='bn'?'বন্ধ':'Close'}</button></div>
   <div class="rv-slide" id="rvS" data-act="rvNext"></div><p style="color:#6d695f;font-size:12px;text-align:center">${bn?'পরেরটায় যেতে ট্যাপ করো':'Tap to continue'}</p></div>`;
  RV={slides,i:0,t0:Date.now()};showSlide();clearInterval(RV.iv);
  RV.iv=setInterval(()=>{if(!RV)return;const f=(Date.now()-RV.t0)/6000;const bars=el.querySelectorAll('.rv-bars b');bars.forEach((b,i)=>b.style.width=(i<RV.i?100:i===RV.i?Math.min(100,f*100):0)+'%');if(f>=1&&RV.i<RV.slides.length-1){RV.i++;showSlide()}},100);
}
function showSlide(){const el=document.getElementById('rvS');el.innerHTML=RV.slides[RV.i];RV.t0=Date.now();
  if(document.getElementById('rvCv')){const prev=S.world;const cv=document.getElementById('rvCv');const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
    const wk=S.sessions.filter(s=>s.start>=addDays(dayStart(Date.now()),-6)).slice(-6),off=mkCanvas();ctx.fillStyle='#17221d';ctx.fillRect(0,0,192,96);
    wk.forEach((s,i)=>{drawScene(off,sceneFor(s),progressOf(s),{now:0});ctx.drawImage(off,0,0,96,96,(i%3)*64,Math.floor(i/3)*48,64,48)});S.world=prev}}
function closeReview(){if(RV)clearInterval(RV.iv);RV=null;document.getElementById('review').hidden=true}

/* ================= mixer sheet ================= */
function openMixer(){
  AU.init();AU.resume();
  const bn=L()==='bn',el=document.getElementById('sheet');el.hidden=false;
  if(!RUN)AU.apply(S.settings.mix),AU.fade(1,.6);
  el.innerHTML=`<div class="sheet-wrap" data-act="mixClose" data-self="1"><div class="sheet" role="dialog" aria-label="${t('Sound mix')}">
   <div class="grab"></div><div class="row between"><h2>${t('Sound mix')}</h2><button class="btn sm primary" data-act="mixClose">${t('Done')}</button></div>
   <p class="eyebrow">${t('Presets')}</p>
   <div class="presets">${PRESETS.map((p,i)=>`<button class="chip" data-act="preset" data-i="${i}">${bn?p.bn:p.n}</button>`).join('')}<button class="chip" data-act="preset" data-i="-1">${t('Silent')}</button></div>
   <div style="display:flex;flex-direction:column;gap:14px" id="sndList">${SOUNDS.map(s=>sndRow(s)).join('')}</div>
   <div class="snd"><span class="ico">${svg('note')}</span><div><div class="nm"><label for="mvol">${t('Master volume')}</label></div><input type="range" id="mvol" min="0" max="1" step="0.01" value="${S.settings.master}"></div></div>
   <p class="muted" style="font-size:12px">${bn?'সব শব্দ এই ডিভাইসেই তৈরি হয়, কোনো ফাইল ডাউনলোড হয় না। সেশনের শুরুতে আস্তে বাড়ে, শেষে আস্তে কমে।':'Every sound is synthesised on the device, no downloads. It fades in when a block starts and out when it ends.'}</p>
  </div></div>`;
}
function sndRow(s){const v=S.settings.mix[s.id]||0;return `<div class="snd"><button class="ico" data-act="sndToggle" data-id="${s.id}" aria-pressed="${v>0}" aria-label="${t(s.n)}">${svg(s.ico)}</button>
  <div><div class="nm"><span>${t(s.n)} <small>${L()==='bn'?'':esc(s.d)}</small></span><span class="mono muted">${v>0?nn(Math.round(v*100)):''}</span></div><input type="range" data-snd="${s.id}" min="0" max="1" step="0.01" value="${v}" aria-label="${t(s.n)}"></div></div>`}
function refreshSnd(){const l=document.getElementById('sndList');if(l)l.innerHTML=SOUNDS.map(sndRow).join('')}
function closeMixer(){document.getElementById('sheet').hidden=true;document.getElementById('sheet').innerHTML='';save();if(!RUN){AU.fade(0,.8);setTimeout(()=>{if(!RUN)AU.stopAll()},900)}if(route()==='focus'&&!RUN)render()}

/* ================= misc ================= */
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
function go(r){document.getElementById('done').hidden=true;if(location.hash==='#'+r)render();else location.hash=r}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast(t('Copied'))}catch(e){toast(L()==='bn'?'কপি করা যায়নি।':'Copy is blocked here.')}}
function applyThemeSetting(){const v=S.settings.theme,root=document.documentElement;if(v==='auto'){if(root.dataset.ffSet){root.removeAttribute('data-theme');delete root.dataset.ffSet}}else{root.setAttribute('data-theme',v);root.dataset.ffSet='1'}}

const ACT={
  quick(el){S.setup.min=+el.dataset.min;save();startSession(S.setup.min)},
  setmin(el){S.setup.min=+el.dataset.min;save();render()},
  setcat(el){S.setup.cat=+el.dataset.i;save();render()},
  settheme(el){S.setup.theme=el.dataset.th;save();render()},
  start(){S.setup.label=(document.getElementById('label')||{value:S.setup.label}).value;save();startSession(S.setup.min)},
  routine(el){const r=ROUTINES[+el.dataset.i];const blocks=r.b;const ft=blocks.filter(b=>b.length>1).length;
    startSession(blocks[0][0],{cat:blocks[0][1],label:'',routine:{name:L()==='bn'?r.bn:r.n,blocks,idx:0,focusIdx:1,focusTotal:ft}})},
  mixer(){openMixer()},
  mixClose(el,e){if(el.dataset.self&&e.target!==el)return;closeMixer()},
  preset(el){const i=+el.dataset.i;S.settings.mix=i<0?{}:Object.assign({},PRESETS[i].mix);AU.apply(S.settings.mix);refreshSnd();save()},
  sndToggle(el){const id=el.dataset.id,v=S.settings.mix[id]||0;S.settings.mix[id]=v>0?0:.5;AU.set(id,S.settings.mix[id]);refreshSnd();save()},
  pause(){if(!RUN)return;accumulate();RUN.state=RUN.state==='paused'?'running':'paused';RUN.autoPaused=false;if(RUN.state==='paused')AU.fade(.25,.6);else AU.fade(1,.6);paintSession()},
  stop(){if(!RUN)return;if(RUN.armStop>Date.now()){finish(false)}else{RUN.armStop=Date.now()+3000;paintSession()}},
  deep(){const el=document.getElementById('session');el.classList.toggle('deep');if(el.classList.contains('deep')){try{el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(e){}}else{try{document.fullscreenElement&&document.exitFullscreen().catch(()=>{})}catch(e){}}},
  deepTap(){if(document.getElementById('session').classList.contains('deep'))ACT.deep()},
  breakGo(el){const d=document.getElementById('done'),r=d._routine;if(r&&r.blocks[r.idx+1])startBreak(r.blocks[r.idx+1][0],r);else startBreak(+(el.dataset.min||5),null)},
  breakEnd(){breakEnd()},breakQuit(){breakQuit()},
  home(){go('today')},
  copySum(){const s=document.getElementById('done')._sess;if(!s)return;const bn=L()==='bn';
    copyText(bn?`FocusFreak: ${itemName(s)}। ${fmtDur(s.verified)} যাচাইকৃত ফোকাস (${fmtDur(s.claimed)} দাবিকৃত)।`:`FocusFreak: ${itemName(s)}. ${fmtDur(s.verified)} of verified focus (${fmtDur(s.claimed)} claimed).`)},
  review(){openReview()},rvClose(){closeReview()},
  rvNext(el,e){if(e.target.closest('button'))return;if(RV.i<RV.slides.length-1){RV.i++;showSlide()}else closeReview()},
  world(el){S.world=el.dataset.th;render()},
  clearSample(){S.sessions=S.sessions.filter(s=>!s.sample);save();render();toast(L()==='bn'?'নমুনা ইতিহাস মুছে ফেলা হয়েছে।':'Sample history cleared.')},
  backup(){copyText(JSON.stringify({app:'focusfreak-web',v:1,sessions:real(),settings:S.settings}))},
  erase(el){if(el.dataset.arm==='1'){try{Object.keys(localStorage).filter(k=>k.startsWith('ffw.')).forEach(k=>localStorage.removeItem(k))}catch(e){}
      S.sessions=[];S.settings=Object.assign({},DEF_SETTINGS);save();render();toast(L()==='bn'?'সব মুছে ফেলা হয়েছে।':'Everything erased.')}
    else{el.dataset.arm='1';el.textContent=t('Tap again to erase');setTimeout(()=>{if(el.isConnected){el.dataset.arm='';el.textContent=t('Erase everything')}},3000)}},
  lang(el){S.settings.lang=el.dataset.v;save();render()},
  strict(){S.settings.strict=!S.settings.strict;save();render()},
  themeSet(el){S.settings.theme=el.dataset.v;save();applyThemeSetting();render()},
  unlock(el){const k=el.dataset.k;if(k==='aurora')S.settings.sky=S.settings.sky==='aurora'?'night':'aurora';else S.settings.tree=S.settings.tree===k?'banyan':k;save();render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='minRange'){S.setup.min=+el.value;document.getElementById('dialMin').textContent=nn(el.value);document.querySelectorAll('[data-act=setmin]').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.min===S.setup.min));
    document.querySelectorAll('canvas[data-preview]').forEach(cv=>{cv.dataset.min=el.value;drawScene(cv,{theme:cv.dataset.preview,planned:+el.value,seed:4242,vigor:1,tree:S.settings.tree,aurora:S.settings.sky==='aurora'},1,{now:900})});
    document.getElementById('growHint').textContent=growHint();save()}
  else if(el.id==='label'){S.setup.label=el.value;save()}
  else if(el.id==='intent'){S.intention.text=el.value;save()}
  else if(el.id==='goalR'){S.settings.goal=+el.value;el.previousElementSibling.querySelector('small').textContent=fmtDur(S.settings.goal*60);save()}
  else if(el.id==='mvol'){S.settings.master=+el.value;AU.master(+el.value);save()}
  else if(el.dataset.snd){const id=el.dataset.snd;S.settings.mix[id]=+el.value;AU.set(id,+el.value);const row=el.closest('.snd');row.querySelector('.ico').setAttribute('aria-pressed',+el.value>0);row.querySelector('.nm .mono').textContent=+el.value>0?nn(Math.round(el.value*100)):'';save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('sheet').hidden)closeMixer();else if(RV)closeReview();else if(document.getElementById('session').classList.contains('deep'))ACT.deep()}
  if(e.key===' '&&RUN&&!document.getElementById('session').hidden&&document.activeElement.tagName!=='INPUT'){e.preventDefault();ACT.pause()}});
// keep World panorama crane/beacons alive
setInterval(()=>{if(route()==='world'&&S.world==='city'&&document.getElementById('pano')&&!RUN)drawPano()},600);

applyThemeSetting();render();
</script>
